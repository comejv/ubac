<!doctype html>
<html>
  <head>
    <title>UBAC Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" charset="utf-8" />
    <style>
      body {
        font-family: sans-serif;
        margin: 16px;
        background-color: #f4f4f9;
        color: #222;
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
      }
      .card {
        background: white;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 12px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 14px;
        align-items: center;
        justify-content: space-between;
        margin: 10px 0;
      }
      .row-left {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 14px;
        align-items: center;
      }
      button,
      select {
        padding: 8px 10px;
      }
      .status {
        font-size: 13px;
        color: #555;
        margin-top: 8px;
      }
      .status.error {
        color: #b00020;
      }
      .channels {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        margin-top: 10px;
      }
      .ch {
        user-select: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.04);
      }
      .dot {
        width: 10px;
        height: 10px;
      }
      .ch.off {
        opacity: 0.35;
      }
      #chart {
        width: 100% !important;
        height: 420px !important;
      }
      #task-chart {
        width: 100% !important;
        height: 100% !important;
      }
    </style>

    <!-- Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>

  <body>
    <div class="container">
      <h1>Temperature Evolution</h1>

      <div class="card">
        <div class="row">
          <div class="row-left">
            <label>
              Range:
              <select id="range">
                <option value="1">Last 1h</option>
                <option value="6">Last 6h</option>
                <option value="24" selected>Last 24h</option>
                <option value="168">Last 7d</option>
              </select>
            </label>

            <label>
              Max points:
              <select id="maxPoints">
                <option value="400">400</option>
                <option value="800" selected>800</option>
                <option value="1500">1500</option>
                <option value="3000">3000</option>
                <option value="5000">5000</option>
              </select>
            </label>

            <button id="refresh">Refresh</button>
            <button id="fake">Fake Data</button>
            <button id="reset_wifi" style="background:#fee; border-color:#fcc; color:#900;">Reset WiFi</button>

            <div id="cpu-info" style="font-size: 13px; font-family: monospace; background: #eee; padding: 4px 8px; border-radius: 4px; cursor: pointer;" onclick="toggleTaskPanel()">
              CPU: <span id="cpu0">--</span>% | <span id="cpu1">--</span>% (Tasks &#9660;)
            </div>

            <label>
              <input type="checkbox" id="auto" checked />
              Auto (60s)
            </label>
          </div>
          <div class="row-left" style="font-weight: bold; background: #eef; padding: 6px 12px; border-radius: 6px; border: 1px solid #ccd;">
            <span style="color: #008080;">Room: <span id="val-room">--</span>°C</span>
            <span style="margin: 0 8px; color: #ccc;">|</span>
            <span style="color: #6a5acd;">Hum: <span id="val-hum">--</span>%</span>
          </div>
        </div>

        <canvas id="chart"></canvas>

        <div id="channels" class="channels"></div>
        <div id="status" class="status"></div>
      </div>

      <div id="task-panel" class="card" style="margin-top: 20px; display: none;">
        <h3>Per Task CPU Usage (Live)</h3>
        <div style="height: 300px; position: relative;">
          <canvas id="task-chart"></canvas>
        </div>
        <div id="task-list" style="font-size: 12px; margin-top: 10px; columns: 3; font-family: monospace;"></div>
      </div>
    </div>

    <script>
      const NTC_COUNT = 10;
      const SCALE_DEFAULT = 100;

      const colors = [
        "#e6194b",
        "#3cb44b",
        "#ffe119",
        "#4363d8",
        "#f58231",
        "#911eb4",
        "#46f0f0",
        "#f032e6",
        "#bcf60c",
        "#fabebe",
        "#008080", // Room Temp
        "#6a5acd", // Humidity
      ];

      const enabled = Array.from({ length: NTC_COUNT + 2 }, () => true);

      const rangeEl = document.getElementById("range");
      const maxPointsEl = document.getElementById("maxPoints");
      const refreshBtn = document.getElementById("refresh");
      const autoEl = document.getElementById("auto");
      const statusEl = document.getElementById("status");
      const channelsEl = document.getElementById("channels");

      let chart = null;
      let taskChart = null;
      let autoTimer = null;
      let taskHistory = {}; // { taskName: [{x: time, y: usage}, ...] }
      const MAX_HISTORY_POINTS = 60; // 5 minutes if 5s interval
      let prevCpuData = null; // { total: uint32, tasks: { name: runtime } }
      let cpuPollTimer = null;

      function toggleTaskPanel() {
        const p = document.getElementById("task-panel");
        p.style.display = p.style.display === "none" ? "block" : "none";
        if (p.style.display === "block" && !taskChart) {
          buildTaskChart();
        }
      }

      function buildTaskChart() {
        const ctx = document.getElementById("task-chart").getContext("2d");
        const datasets = [];

        // Populate datasets from existing history
        for (const [name, data] of Object.entries(taskHistory)) {
           const color = `hsl(${Math.random() * 360}, 70%, 50%)`;
           datasets.push({
             label: name,
             data: data,
             borderColor: color,
             borderWidth: 1,
             pointRadius: 0,
             tension: 0.2
           });
        }

        taskChart = new Chart(ctx, {
          type: "line",
          data: { datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
              x: { type: "linear", display: false, min: Date.now() - MAX_HISTORY_POINTS * 5000, max: Date.now() },
              y: { title: { display: true, text: "%" }, min: 0, max: 100 },
            },
            plugins: {
              legend: {
                position: "right",
                labels: { boxWidth: 10, font: { size: 10 } }
              }
            }
          }
        });
      }

      function updateTaskChart(tasks) {
        const now = Date.now();
        const taskListEl = document.getElementById("task-list");
        let listHtml = "";

        tasks.forEach(t => {
          if (!taskHistory[t.n]) {
            taskHistory[t.n] = [];
            // Add new dataset to chart if it exists
            if (taskChart) {
              const color = `hsl(${Math.random() * 360}, 70%, 50%)`;
              taskChart.data.datasets.push({
                label: t.n,
                data: taskHistory[t.n],
                borderColor: color,
                borderWidth: 1,
                pointRadius: 0,
                tension: 0.2
              });
            }
          }
          taskHistory[t.n].push({ x: now, y: t.u });
          if (taskHistory[t.n].length > MAX_HISTORY_POINTS) {
            taskHistory[t.n].shift();
          }

          let coreStr = t.c;
          if (t.c === -1 || t.c >= 2147483647) coreStr = "*";

          listHtml += `<div>${t.n.padEnd(12)}: ${t.u.toFixed(1).padStart(5)}% (C${coreStr})</div>`;
        });

        taskListEl.innerHTML = listHtml;

        if (taskChart) {
          // Keep x axis moving
          taskChart.options.scales.x.min = now - MAX_HISTORY_POINTS * 5000;
          taskChart.options.scales.x.max = now;
          taskChart.update();
        }
      }

      function setStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.className = isError ? "status error" : "status";
      }

      function fmtTime(ms) {
        const d = new Date(ms);
        return d.toLocaleString();
      }

      function setupChannels() {
        channelsEl.innerHTML = "";
        const labels = [...Array.from({length: NTC_COUNT}, (_, i) => `NTC ${i}`), "Room Temp", "Humidity"];
        for (let ch = 0; ch < labels.length; ch++) {
          const el = document.createElement("div");
          el.className = "ch";
          el.innerHTML = `<div class="dot" style="background:${colors[ch]}"></div>
                          <div>${labels[ch]}</div>`;
          el.addEventListener("click", () => {
            enabled[ch] = !enabled[ch];
            el.classList.toggle("off", !enabled[ch]);
            if (chart) {
              chart.data.datasets[ch].hidden = !enabled[ch];
              chart.update();
            }
          });
          channelsEl.appendChild(el);
        }
      }

      function buildChart() {
        const ctx = document.getElementById("chart").getContext("2d");

        const labels = [...Array.from({length: NTC_COUNT}, (_, i) => `NTC ${i}`), "Room Temp", "Humidity"];
        const datasets = labels.map((label, ch) => ({
          label: label,
          data: [],
          borderColor: colors[ch],
          backgroundColor: colors[ch],
          borderWidth: ch < NTC_COUNT ? 2 : 3, // Make Room/Hum slightly thicker
          pointRadius: 0,
          tension: 0.15,
          spanGaps: true,
          hidden: !enabled[ch],
          yAxisID: ch === NTC_COUNT + 1 ? "y1" : "y", // Humidity on y1
        }));

        chart = new Chart(ctx, {
          type: "line",
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            parsing: false,
            normalized: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  title: (items) => {
                    if (!items.length) return "";
                    return fmtTime(items[0].parsed.x);
                  },
                },
              },
              decimation: {
                enabled: true,
                algorithm: "lttb",
                samples: 800,
              },
            },
            scales: {
              x: {
                type: "linear",
                title: { display: true, text: "Time" },
                ticks: {
                  callback: (value) => {
                    const d = new Date(Number(value));
                    const hh = String(d.getHours()).padStart(2, "0");
                    const mm = String(d.getMinutes()).padStart(2, "0");
                    return `${hh}:${mm}`;
                  },
                },
              },
              y: {
                title: { display: true, text: "°C" },
              },
              y1: {
                position: "right",
                title: { display: true, text: "% RH" },
                min: 0,
                max: 100,
                grid: { drawOnChartArea: false },
              },
            },
          },
        });
      }

      function downsample(records, maxPoints) {
        if (records.length <= maxPoints) return records;
        const step = Math.ceil(records.length / maxPoints);
        const out = [];
        for (let i = 0; i < records.length; i += step) out.push(records[i]);
        if (out[out.length - 1] !== records[records.length - 1]) {
          out.push(records[records.length - 1]);
        }
        return out;
      }

      function updateChartWithData(data, maxPoints) {
        if (!Array.isArray(data)) data = [];

        // Update latest values in UI
        if (data.length > 0) {
          const last = data[data.length - 1];
          const s = Number(last.s || SCALE_DEFAULT);
          const r = Number(last.r);
          const h = Number(last.h);

          document.getElementById("val-room").textContent = (r === -32768) ? "--" : (r / s).toFixed(1);
          document.getElementById("val-hum").textContent = (h === -32768) ? "--" : (h / s).toFixed(1);
        }

        // Downsample BEFORE building datasets (keeps JS cost low)
        data = downsample(data, maxPoints);

        // Build per-channel points
        const points = Array.from({ length: NTC_COUNT + 2 }, () => []);

        for (const r_rec of data) {
          const t = Number(r_rec.t);
          const s = Number(r_rec.s || SCALE_DEFAULT);
          const v = r_rec.v;

          if (!t || !Array.isArray(v) || v.length < NTC_COUNT) continue;

          const x = t * 1000;

          // NTCs
          for (let ch = 0; ch < NTC_COUNT; ch++) {
            const raw = Number(v[ch]);
            if (raw === -32768) continue;
            points[ch].push({ x, y: raw / s });
          }

          // Room Temp
          if (r_rec.r !== undefined && Number(r_rec.r) !== -32768) {
            points[NTC_COUNT].push({ x, y: Number(r_rec.r) / s });
          }

          // Humidity
          if (r_rec.h !== undefined && Number(r_rec.h) !== -32768) {
            points[NTC_COUNT + 1].push({ x, y: Number(r_rec.h) / s });
          }
        }

        for (let ch = 0; ch < NTC_COUNT + 2; ch++) {
          chart.data.datasets[ch].data = points[ch];
        }
        chart.update();

        const newest = data.length ? data[data.length - 1].t * 1000 : 0;
        setStatus(
          `Loaded ${data.length} records. Newest: ${
            newest ? fmtTime(newest) : "n/a"
          }`
        );
      }

      async function loadData() {
        try {
          setStatus("Loading...");

          const hours = Number(rangeEl.value);
          const maxPoints = Number(maxPointsEl.value);

          // Use client time for 'since' (works even if ESP32 clock isn't set).
          const since = Math.floor(Date.now() / 1000) - hours * 3600;

          const url = `/history.json?since=${since}&max=${maxPoints}`;
          const resp = await fetch(url, { cache: "no-store" });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

          let data = await resp.json();
          updateChartWithData(data, maxPoints);
        } catch (e) {
          console.error(e);
          setStatus(`Failed to load data: ${String(e.message || e)}`, true);
        }
      }

      function calcUsage(curr, prev, total) {
        if (total === 0) return 0;
        let diff = curr - prev;
        if (curr < prev) diff = (0xFFFFFFFF - prev) + curr + 1;
        return (100 * diff) / total;
      }

      async function loadCpuStats() {
        try {
          const resp = await fetch("/cpu.json");
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          if (data.error) {
            document.getElementById("cpu-info").textContent = "CPU: disabled (Kconfig)";
            return;
          }

          if (prevCpuData) {
            let totalDiff = data.total - prevCpuData.total;
            if (data.total < prevCpuData.total) totalDiff = (0xFFFFFFFF - prevCpuData.total) + data.total + 1;

            if (totalDiff > 0) {
              const taskUsages = [];
              let c0_idle = 0, c1_idle = 0;

              data.tasks.forEach(t => {
                const prevRuntime = prevCpuData.tasks[t.n] || 0;
                const usage = calcUsage(t.r, prevRuntime, totalDiff);

                taskUsages.push({ n: t.n, u: usage, c: t.c });

                if (t.n === "IDLE" || t.n === "IDLE0") c0_idle = usage;
                else if (t.n === "IDLE1") c1_idle = usage;
              });

              document.getElementById("cpu0").textContent = (100 - c0_idle).toFixed(1);
              document.getElementById("cpu1").textContent = (100 - c1_idle).toFixed(1);

              taskUsages.sort((a, b) => b.u - a.u);
              updateTaskChart(taskUsages);
            }
          }

          // Update prev state
          const nextPrev = { total: data.total, tasks: {} };
          data.tasks.forEach(t => nextPrev.tasks[t.n] = t.r);
          prevCpuData = nextPrev;

          // Schedule next poll based on interval from server
          if (cpuPollTimer) clearTimeout(cpuPollTimer);
          cpuPollTimer = setTimeout(loadCpuStats, data.interval || 2000);

        } catch (e) {
          console.warn("CPU stats load failed", e);
          if (cpuPollTimer) clearTimeout(cpuPollTimer);
          cpuPollTimer = setTimeout(loadCpuStats, 5000);
        }
      }

      function updateAuto() {
        if (autoTimer) clearInterval(autoTimer);
        autoTimer = null;

        if (autoEl.checked) {
          autoTimer = setInterval(loadData, 60_000);
        }
      }

      setupChannels();
      buildChart();
      loadCpuStats();
      setInterval(loadCpuStats, 3000);

      document.getElementById("reset_wifi").addEventListener("click", async () => {
        if (!confirm("Are you sure you want to clear WiFi credentials and restart the device?")) return;
        try {
          setStatus("Resetting WiFi...");
          const resp = await fetch("/reset_wifi", { method: "POST" });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          setStatus("WiFi reset. Device is restarting. Connect to 'UBAC_Config' AP.");
        } catch (e) {
          setStatus(`Failed to reset WiFi: ${e.message}`, true);
        }
      });

      refreshBtn.addEventListener("click", loadData);
      document.getElementById("fake").addEventListener("click", async () => {
        try {
          setStatus("Fetching temporary fake data...");
          const resp = await fetch("/fake_history.json");
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          updateChartWithData(data, 1000);
          setStatus("Temporary fake data loaded (not saved to flash).");
        } catch (e) {
          setStatus(`Failed to fetch fake data: ${e.message}`, true);
        }
      });
      rangeEl.addEventListener("change", loadData);
      maxPointsEl.addEventListener("change", loadData);
      autoEl.addEventListener("change", updateAuto);

      updateAuto();
      loadData();
    </script>
  </body>
</html>
